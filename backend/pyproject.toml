[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "uploads", "exports", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"ai/embeddings.py" = ["B904"]
"ai/nvidia_client.py" = ["B904"]
"ai/whisper_model.py" = ["F401"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
